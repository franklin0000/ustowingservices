<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="apple-touch-icon" href="/logo.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>US Towing Services</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <script>
      (function() {
        const CURRENT_VERSION = 'v2.2.0-safe-filter';
        const stored = localStorage.getItem('app_pwa_version_tag');
        if (stored && stored !== CURRENT_VERSION) {
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              for (let k of keys) caches.delete(k);
            });
          }
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (let r of regs) r.unregister();
            });
          }
          localStorage.setItem('app_pwa_version_tag', CURRENT_VERSION);
          window.location.reload(true);
        } else {
          localStorage.setItem('app_pwa_version_tag', CURRENT_VERSION);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
